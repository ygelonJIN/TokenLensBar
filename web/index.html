<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenlens · 本地用量看板</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --panel-2: #f0f0f2;
    --line: #d9d9de;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #007aff;
    --accent-2: #5e5ce6;
    --warn: #b25000;
    --hover: rgba(0, 0, 0, .035);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --panel-2: #3a3a3c;
      --line: #3a3a3c;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --accent: #0a84ff;
      --accent-2: #5e5ce6;
      --warn: #ff9f0a;
      --hover: rgba(255, 255, 255, .06);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 28px 60px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 13px; font-size: 13px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tabs button:hover { color: var(--text); background: var(--hover); }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 15px 17px; }
  .card .k { color: var(--muted); font-size: 12px; margin-bottom: 7px; letter-spacing: .3px; }
  .card .v { font-size: 25px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .card .v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 5px; }

  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 18px; }
  section h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  section .hint { color: var(--muted); font-size: 12px; margin-bottom: 18px; }

  .treemap { position: relative; height: 300px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tm { position: absolute; box-sizing: border-box; overflow: hidden; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: 4px; }
  .tm-model { background: color-mix(in srgb, var(--c) 18%, var(--panel)); border-color: color-mix(in srgb, var(--c) 40%, var(--line)); }
  .tm-agent { background: color-mix(in srgb, var(--c) 36%, var(--panel)); border-color: color-mix(in srgb, var(--c) 65%, var(--line)); }
  .tm .n { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm .v { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-small { padding: 3px 5px; }
  .tm-small .n { font-size: 10px; font-weight: 500; }
  .tm-small .v { display: none; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 10px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--hover); }

  .name { color: var(--text); font-weight: 500; }
  .agents { color: var(--muted); font-size: 11px; margin-left: 8px; }
  .share { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .share .track { width: 62px; height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .share .fill { height: 100%; background: var(--accent-2); border-radius: 3px; }
  .cost { color: var(--accent); }

  .warn { background: color-mix(in srgb, var(--warn) 9%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn);
          border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 18px; }
  .warn b { font-weight: 600; }

  footer { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  tbody tr.dim td { color: var(--muted); }
  tbody tr.dim td .cost { color: var(--muted); }
  @media (max-width: 860px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    body { padding: 20px 14px 40px; }
    .treemap { height: 240px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tokenlens <span>本地 token 用量 · 数据不出本机 · 余额查询可选</span></h1>
    <div class="tabs" id="tabs">
      <button data-days="7">7 天</button>
      <button data-days="30" class="on">30 天</button>
      <button data-days="90">90 天</button>
      <button data-days="3650">全部</button>
    </div>
  </header>

  <div id="content">
    <div class="empty">加载中…</div>
  </div>

  <footer>
    <span id="src"></span>
    <span id="stamp"></span>
  </footer>
</div>

<script>
const fmt = (n) => {
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
  return String(Math.round(n));
};
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let current = 30;

async function load(days) {
  current = days;
  const res = await fetch('/api/summary?days=' + days);
  const d = await res.json();
  render(d);
}


const TREE_COLORS = ['#0a84ff', '#5e5ce6', '#ff9f0a', '#ff375f', '#30d158', '#64d2ff'];
let treeColorFor = new Map();

function buildTree(d) {
  const models = new Map();
  (d.matrix || []).forEach(c => {
    const model = c.model || '(未知)';
    const agent = c.agent || '(未知)';
    if (!models.has(model)) models.set(model, { name: model, tokens: 0, cost: 0, children: new Map() });
    const m = models.get(model);
    m.tokens += c.total;
    m.cost += c.cost;
    if (!m.children.has(agent)) m.children.set(agent, { name: agent, tokens: 0, cost: 0 });
    const a = m.children.get(agent);
    a.tokens += c.total;
    a.cost += c.cost;
  });
  return [...models.values()]
    .map(m => ({ ...m, children: [...m.children.values()] }))
    .filter(m => m.tokens > 0)
    .sort((a, b) => b.tokens - a.tokens);
}

function layoutTree(items, x, y, w, h, depth, out, inheritedColor) {
  const total = items.reduce((sum, item) => sum + item.tokens, 0);
  if (!items.length || total <= 0) return;

  if (items.length === 1) {
    const item = items[0];
    const color = inheritedColor || treeColorFor.get(item.name) || TREE_COLORS[0];
    if (depth === 0 && item.children && item.children.length > 1) {
      const header = Math.min(7, Math.max(3, h * 0.20));
      out.push({ kind: 'model', item, x, y, w, h, color });
      layoutTree(item.children, x, y + header, w, h - header, depth + 1, out, color);
    } else {
      out.push({ kind: depth === 0 ? 'model' : 'agent', item, x, y, w, h, color });
    }
    return;
  }

  let split = 1;
  let acc = 0;
  for (; split < items.length; split++) {
    acc += items[split - 1].tokens;
    if (acc >= total / 2) break;
  }
  if (split >= items.length) split = items.length - 1;

  const first = items.slice(0, split);
  const second = items.slice(split);
  const ratio = first.reduce((sum, item) => sum + item.tokens, 0) / total;

  if (w >= h) {
    layoutTree(first, x, y, w * ratio, h, depth, out, inheritedColor);
    layoutTree(second, x + w * ratio, y, w * (1 - ratio), h, depth, out, inheritedColor);
  } else {
    layoutTree(first, x, y, w, h * ratio, depth, out, inheritedColor);
    layoutTree(second, x, y + h * ratio, w, h * (1 - ratio), depth, out, inheritedColor);
  }
}

function renderTreemap(tree) {
  const total = tree.reduce((sum, item) => sum + item.tokens, 0);
  if (!total) return '<div class="empty">暂无数据</div>';
  treeColorFor = new Map(tree.map((m, i) => [m.name, TREE_COLORS[i % TREE_COLORS.length]]));
  const out = [];
  layoutTree(tree, 0, 0, 100, 100, 0, out, undefined);
  return `<div class="treemap">${out.map(r => {
    const share = (r.item.tokens / total * 100).toFixed(1);
    const small = (r.w * r.h) < 90 ? ' tm-small' : '';
    const value = r.kind === 'model'
      ? `${fmt(r.item.tokens)} · ${share}%`
      : fmt(r.item.tokens);
    const cls = r.kind === 'model' ? 'tm-model' : 'tm-agent';
    return `<div class="tm ${cls}${small}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;--c:${r.color}"><span class="n">${esc(r.item.name)}</span><span class="v">${value}</span></div>`;
  }).join('')}</div>`;
}

function render(d) {
  const box = document.getElementById('content');
  if (!d.ok) {
    box.innerHTML = '<div class="empty">还没有数据。先运行 <code>python3 tokenlens.py scan</code></div>';
    return;
  }

  const t = d.totals;
  const hitRate = t.input ? (t.cache_read / t.input * 100) : 0;
  const sym = d.symbol;

  const cars = `
    <div class="cards">
      <div class="card">
        <div class="k">总 TOKEN</div>
        <div class="v">${fmt(t.tokens)}</div>
        <div class="sub">${t.events.toLocaleString()} 次请求</div>
      </div>
      <div class="card">
        <div class="k">成本</div>
        <div class="v">${sym}${t.cost.toFixed(2)}</div>
        <div class="sub">${d.priced ? '按本地单价表' : '未配置单价表'}</div>
      </div>
      <div class="card">
        <div class="k">缓存命中率</div>
        <div class="v">${hitRate.toFixed(1)}<small>%</small></div>
        <div class="sub">命中 ${fmt(t.cache_read)} / 输入 ${fmt(t.input)}</div>
      </div>
      <div class="card">
        <div class="k">输出</div>
        <div class="v">${fmt(t.output)}</div>
        <div class="sub">输入 ${fmt(t.input)}</div>
      </div>
    </div>`;

  const warn = d.unpriced && d.unpriced.length ? `
    <div class="warn">
      <b>未定价模型：</b>${d.unpriced.map(esc).join('、')}
      —— token 已计入总量，但成本算不出来。补到 <code>~/.tokenlens/prices.json</code> 即可。
    </div>` : '';

  const treeData = buildTree(d);
  const tree = treeData.length ? `
    <section>
      <h2>用量树状图</h2>
      <div class="hint">矩形面积 = Token；外层模型，内层 Agent</div>
      ${renderTreemap(treeData)}
    </section>` : '';

  const grand = t.tokens || 1;
  const modelRows = d.models.map(m => `
    <tr>
      <td><span class="name">${esc(m.model)}</span><span class="agents">${m.agents.map(esc).join(' · ')}</span></td>
      <td>${fmt(m.tokens)}</td>
      <td>${fmt(m.input)}</td>
      <td>${fmt(m.output)}</td>
      <td>${fmt(m.cache_read)}</td>
      <td>${m.events.toLocaleString()}</td>
      <td class="cost">${sym}${m.cost.toFixed(2)}</td>
      <td><div class="share"><div class="track"><div class="fill" style="width:${(m.tokens / grand * 100).toFixed(1)}%"></div></div><span>${(m.tokens / grand * 100).toFixed(1)}%</span></div></td>
    </tr>`).join('');

  const models = `
    <section>
      <h2>按模型</h2>
      <div class="hint">模型名来自各 Agent 自己的日志，代号变了会自动出现新行</div>
      <table>
        <thead><tr><th>模型 / 出现在</th><th>总量</th><th>输入</th><th>输出</th><th>缓存命中</th><th>次数</th><th>成本</th><th>占比</th></tr></thead>
        <tbody>${modelRows}</tbody>
      </table>
    </section>`;

  const agentRows = d.agents.map(a => `
    <tr>
      <td><span class="name">${esc(a.agent)}</span></td>
      <td>${fmt(a.total)}</td>
      <td>${fmt(a.input)}</td>
      <td>${fmt(a.output)}</td>
      <td>${a.count.toLocaleString()}</td>
      <td class="cost">${sym}${a.cost.toFixed(2)}</td>
    </tr>`).join('');

  const agents = `
    <section>
      <h2>按 Agent</h2>
      <div class="hint">同一个 Agent 会切不同厂商和模型，所以这里只回答"哪个工具用的多"</div>
      <table>
        <thead><tr><th>Agent</th><th>总量</th><th>输入</th><th>输出</th><th>次数</th><th>成本</th></tr></thead>
        <tbody>${agentRows}</tbody>
      </table>
    </section>`;

  const matrixRows = (d.matrix || []).map(m => `
    <tr>
      <td><span class="name">${esc(m.agent)}</span></td>
      <td style="text-align:left"><span class="name">${esc(m.model)}</span></td>
      <td>${fmt(m.total)}</td>
      <td>${fmt(m.input)}</td>
      <td>${fmt(m.output)}</td>
      <td>${m.count.toLocaleString()}</td>
      <td class="cost">${sym}${m.cost.toFixed(2)}</td>
    </tr>`).join('');

  const matrix = `
    <section>
      <h2>Agent × 模型</h2>
      <div class="hint">同时回答"哪个 Agent 用了哪个模型、各用了多少"</div>
      <table>
        <thead><tr><th>Agent</th><th style="text-align:left">模型</th><th>总量</th><th>输入</th><th>输出</th><th>次数</th><th>成本</th></tr></thead>
        <tbody>${matrixRows}</tbody>
      </table>
    </section>`;

  const outside = d.outside || [];
  const outsideBlock = outside.length ? `
    <section>
      <h2>窗口外还有</h2>
      <div class="hint">这些 Agent × 模型 在最近 ${d.days} 天没有新记录，但历史数据仍在库里 —— 切到「全部」看完整报表</div>
      <table>
        <thead><tr><th>Agent</th><th style="text-align:left">模型</th><th>历史总量</th><th>成本</th><th>最后使用</th></tr></thead>
        <tbody>
          ${outside.map(o => `
            <tr class="dim">
              <td>${esc(o.agent)}</td>
              <td style="text-align:left">${esc(o.model)}</td>
              <td>${fmt(o.tokens)}</td>
              <td class="cost">${sym}${o.cost.toFixed(2)}</td>
              <td>${new Date(o.last * 1000).toLocaleDateString('zh-CN')}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </section>` : '';

  box.innerHTML = cars + warn + tree + models + agents + matrix + outsideBlock;

  document.getElementById('src').textContent =
    '数据源：' + d.sources.map(s => `${s.agent}(${s.files})`).join('  ') + ' · 本机 SQLite';
  document.getElementById('stamp').textContent =
    '窗口 ' + d.days + ' 天 · ' + new Date().toLocaleString('zh-CN');
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  load(Number(btn.dataset.days));
});

load(current);
</script>
</body>
</html>
